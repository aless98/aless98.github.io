<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Alessandro Albanesi</title>
    <!--
      Served by GitHub Pages for any unmatched path. Every real route is
      prerendered to its own HTML file, so anything landing here is genuinely
      missing — no client-side route recovery is needed, and styles are inlined
      so this page never depends on hashed asset filenames.
    -->
    <style>
      :root {
        --background: #ffffff;
        --foreground: #1c1c20;
        --muted-foreground: #74747d;
        --border: #e7e7ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1c1c20;
          --foreground: #fafafa;
          --muted-foreground: #a1a1aa;
          --border: #33333a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background: var(--background);
        color: var(--foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif;
        font-size: 4rem;
        line-height: 1;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      h1 {
        font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted-foreground);
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 0.625rem;
        color: var(--foreground);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--foreground);
      }
      a.primary {
        background: var(--foreground);
        border-color: var(--foreground);
        color: var(--background);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        This page doesn&rsquo;t exist, or it may have moved. Here&rsquo;s where
        you can go instead.
      </p>
      <nav>
        <a class="primary" href="/">Home</a>
        <a href="/publications">Publications</a>
        <a href="/projects">Projects</a>
        <a href="/cv">CV</a>
        <a href="/contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
