<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      This path used to be its own page. The site is now a single page with
      anchor sections, so this is a redirect stub kept so existing links and
      any indexed URLs still land in the right place. The meta refresh works
      without JavaScript; the canonical tag points search engines at the real
      URL rather than letting this stub compete with it.
    -->
    <title>Redirecting to Contact — Alessandro Albanesi</title>
    <link rel="canonical" href="https://aless98.github.io/#contact" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/#contact" />
  </head>
  <body>
    <p>
      Redirecting to <a href="/#contact">Contact</a>&hellip;
    </p>
  </body>
</html>
